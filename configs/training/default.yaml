# @package training

_target_: speech_recognition.train.Trainer

# Training configuration
max_epochs: 100
gradient_clip_val: 1.0
accumulate_grad_batches: 1
val_check_interval: 1.0
log_every_n_steps: 50

# Optimizer
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.001
  weight_decay: 0.01
  betas: [0.9, 0.98]

# Learning rate scheduler
scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: 0.001
  total_steps: null  # Will be set based on dataset size
  pct_start: 0.1
  anneal_strategy: "cos"

# Loss function
loss:
  _target_: speech_recognition.losses.CTCLoss
  blank_id: 0
  reduction: "mean"
  zero_infinity: true

# Early stopping
early_stopping:
  monitor: "val_wer"
  patience: 10
  mode: "min"
  min_delta: 0.001
