name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11, 3.12]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -e .[dev]
    
    - name: Lint with ruff
      run: |
        ruff check src/ tests/
    
    - name: Format check with black
      run: |
        black --check src/ tests/
    
    - name: Type check with mypy
      run: |
        mypy src/
    
    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=src --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  demo:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: 3.10
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    
    - name: Test demo import
      run: |
        python -c "import streamlit; print('Streamlit available')"
        python -c "from speech_recognition.models import ConformerCTC; print('Models importable')"
        python -c "from speech_recognition.features import MelSpectrogramExtractor; print('Features importable')"
        python -c "from speech_recognition.metrics import WERCalculator; print('Metrics importable')"
    
    - name: Test basic functionality
      run: |
        python -c "
        import torch
        from speech_recognition.models import ConformerCTC
        from speech_recognition.utils import get_device, set_seed
        
        set_seed(42)
        device = get_device('cpu')
        
        model = ConformerCTC(
            input_dim=80,
            encoder_dim=256,
            num_encoder_layers=2,
            num_attention_heads=4,
            feedforward_expansion_factor=2,
            conv_expansion_factor=2,
            dropout=0.1,
            conv_kernel_size=15,
            vocab_size=100,
            blank_id=0,
        )
        
        features = torch.randn(2, 50, 80)
        lengths = torch.tensor([50, 50])
        
        logits, loss = model(features, lengths)
        print(f'Model output shape: {logits.shape}')
        print('Basic functionality test passed!')
        "
